[build]
  publish = "."
  # Generates tools/<slug>/index.html from js/data.js + content/tools/*.json (no dependencies).
  command = "node scripts/build.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Test pages are for local use only — don't serve them on the live site.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
